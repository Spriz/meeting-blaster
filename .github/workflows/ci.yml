name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fyne renders through GLFW, which needs the X11 development headers.
      - name: Install X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  native:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs a C toolchain. macOS runners ship the Xcode command line
      # tools; Windows runners ship Mingw-w64. Print it so a runner image
      # that drops the compiler fails here with an obvious message rather
      # than deep inside the linker.
      - name: Show C compiler
        run: ${{ runner.os == 'Windows' && 'gcc --version' || 'clang --version' }}

      - name: Vet
        run: go vet ./...

      # -race needs cgo, which this job enables, and is supported on both
      # darwin/arm64 and windows/amd64.
      - name: Test
        run: go test -race ./...

      # The first time cmd/, overlay, prefs, tray, singleton and screens are
      # compiled for these platforms in CI. If a per-OS file does not
      # compile, fix the source rather than narrowing this job.
      - name: Build
        run: go build ./...
