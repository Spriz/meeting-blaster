name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  # Required to publish build provenance, which mise and other installers
  # verify when downloading the release archive.
  id-token: write
  attestations: write

# Windows runners default to PowerShell. One shell everywhere keeps the
# packaging steps from forking per OS.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      # On workflow_dispatch GITHUB_REF_NAME is the branch the run was
      # started from, so the explicit input has to win.
      - id: resolve
        run: |
          value="${{ inputs.tag }}"
          if [ -z "$value" ]; then value="$GITHUB_REF_NAME"; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            binary: meeting-blaster
            # Fyne's GLFW builds both X11 and Wayland backends unless told
            # otherwise, and Wayland would need headers this runner lacks.
            goflags: "-tags=x11"
          - target: darwin-arm64
            runner: macos-latest
            binary: meeting-blaster
          # macos-13 was retired in December 2025; macos-15-intel is the
          # current x86_64 image. GitHub drops Intel macOS altogether once
          # the macOS 15 image goes, currently slated for autumn 2027.
          - target: darwin-amd64
            runner: macos-15-intel
            binary: meeting-blaster
          - target: windows-amd64
            runner: windows-latest
            binary: meeting-blaster.exe
            # Without -H=windowsgui a console window sits behind the tray
            # app for the whole session. internal/console is what keeps
            # the command line flags printing anyway.
            ldflags: "-H=windowsgui"
    env:
      CGO_ENABLED: "1"
      GOFLAGS: ${{ matrix.goflags }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      # Fyne renders through GLFW, which needs the X11 development headers.
      - name: Install X11 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev

      # mise is skipped here as it is in CI: the Go version in go.mod is the
      # same one mise.toml pins, and mise.toml's GOFLAGS only suit Linux.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION ${{ matrix.ldflags }}" \
            -o "dist/${{ matrix.binary }}" ./cmd/meeting-blaster

      - name: Package tarball
        if: runner.os != 'Windows'
        run: |
          name="meeting-blaster-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "dist/${{ matrix.binary }}" LICENSE README.md "dist/$name/"
          # The systemd unit and desktop entry are Linux-only, and the
          # macOS equivalent ships as the .app bundle instead.
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p "dist/$name/packaging"
            cp packaging/meeting-blaster.desktop \
               packaging/meeting-blaster.service "dist/$name/packaging/"
          fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Package zip
        if: runner.os == 'Windows'
        run: |
          name="meeting-blaster-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "dist/${{ matrix.binary }}" LICENSE README.md "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Upload macOS binary for bundling
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/meeting-blaster
          if-no-files-found: error

  bundle-macos:
    name: Bundle MeetingBlaster.app
    needs: [version, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-darwin-*
          path: binaries

      - name: Assemble the bundle
        run: |
          mkdir -p dist
          scripts/macos-bundle.sh "$VERSION" dist \
            binaries/binary-darwin-arm64/meeting-blaster \
            binaries/binary-darwin-amd64/meeting-blaster
          lipo -info dist/MeetingBlaster.app/Contents/MacOS/meeting-blaster

      # ditto is the archiver that preserves bundle structure; a plain zip
      # mangles symlinks and extended attributes.
      #
      # The name deliberately carries no architecture token that ubi
      # recognises, which is how mise keeps picking the per-arch tarballs
      # for "mise use -g github:Spriz/meeting-blaster" instead of this.
      - name: Zip the bundle
        run: |
          (cd dist && ditto -c -k --keepParent \
            MeetingBlaster.app "MeetingBlaster-$VERSION-macos-universal.zip")

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: assets-macos-app
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build, bundle-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # One publishing job, so the four builds cannot race each other to
      # create the release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag || \
          gh release upload "$VERSION" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
