name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  # Required to publish build provenance, which mise and other installers
  # verify when downloading the release archive.
  id-token: write
  attestations: write

# Windows runners default to PowerShell. One shell everywhere keeps the
# packaging steps from forking per OS.
defaults:
  run:
    shell: bash

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      # On workflow_dispatch GITHUB_REF_NAME is the branch the run was
      # started from, so the explicit input has to win.
      - id: resolve
        run: |
          value="${{ inputs.tag }}"
          if [ -z "$value" ]; then value="$GITHUB_REF_NAME"; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-latest
          # macos-13 was retired in December 2025; macos-15-intel is the
          # current x86_64 image. GitHub drops Intel macOS altogether once
          # the macOS 15 image goes, currently slated for autumn 2027.
          - target: darwin-amd64
            runner: macos-15-intel
          - target: windows-amd64
            runner: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      # Fyne renders through GLFW, which needs the X11 development headers.
      - name: Install X11 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev

      # mise is skipped here as it is in CI: the Go version in go.mod is the
      # same one mise.toml pins, and mise.toml's GOFLAGS only suit Linux.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      # Build flags, archive layout and the per-target differences all
      # live in scripts/release.sh, so a maintainer can reproduce any
      # asset locally instead of reading them out of this file.
      - name: Build
        run: scripts/release.sh build "$VERSION" ${{ matrix.target }}

      - name: Package
        run: scripts/release.sh package "$VERSION" ${{ matrix.target }}

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Upload macOS binary for bundling
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/meeting-blaster
          if-no-files-found: error

  bundle-macos:
    name: Bundle MeetingBlaster.app
    needs: [version, build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-darwin-*
          path: binaries

      - name: Assemble the bundle
        run: |
          scripts/release.sh bundle "$VERSION" dist \
            binaries/binary-darwin-arm64/meeting-blaster \
            binaries/binary-darwin-amd64/meeting-blaster
          lipo -info dist/MeetingBlaster.app/Contents/MacOS/meeting-blaster

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: assets-macos-app
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build, bundle-macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: assets-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: scripts/release.sh checksums dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # One publishing job, so the four builds cannot race each other to
      # create the release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag || \
          gh release upload "$VERSION" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
